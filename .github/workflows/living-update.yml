# .github/workflows/living-update.yml
#
# The living-document automation for "The Shifting Weight of Nations."
#
# What it does:
#   * runs on a schedule (after the two annual IMF WEO releases) and whenever build/data.py
#     changes, and can be run by hand (workflow_dispatch);
#   * installs deps + system font libs, stages the bundled fonts;
#   * runs the 52-check consistency suite — a red check FAILS the job and blocks everything;
#   * rebuilds all three editions from the single source of truth;
#   * pushes the rebuilt outputs to the review branch living-update/auto-rebuild (never commits
#     to main blind) and prints a link; the owner opens the PULL REQUEST from that link, so a
#     human ratifies before publication — the "directions, not decimals" gate in CI form.
#     (The workflow does not open the PR itself, so the repository setting "Allow GitHub
#     Actions to create and approve pull requests" can stay off.)
#
# Site deployment is handled separately by .github/workflows/pages.yml (the landing page + the
# interactive edition). This workflow only rebuilds editions and pushes a review branch — it does NOT deploy,
# so a data-file push can never replace the landing page with the bare edition.
#
# Setup (one time, in repo Settings):
#   Pages → Source → "GitHub Actions"
#   (No Actions permission change is needed: this file grants itself contents: write.)

name: living-update

on:
  schedule:
    # ~2 weeks after the IMF WEO April and October releases (UTC). Adjust as needed.
    - cron: "0 6 1 5 *"    # 1 May
    - cron: "0 6 1 11 *"   # 1 November
  push:
    branches: [main]   # without this, every tag push (v8.x) also runs the rebuild
    paths:
      - "build/data.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev libcairo2 fonts-dejavu-core fontconfig

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint fonttools brotli pypdf cairosvg pyspellchecker matplotlib numpy

      - name: Stage bundled fonts
        run: |
          mkdir -p ~/.fonts
          cp build/ttf/*.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f

      - name: Consistency suite (blocks the build if red)
        working-directory: build
        run: |
          set -o pipefail
          # check_consistency.py exits nonzero when any check fails; pipefail makes
          # that exit code propagate through the tee pipe and fail the step.
          python3 check_consistency.py | tee /tmp/checks.txt
          # Belt-and-braces text gate: anchor to ', 0 FAILED' at end of the RESULT
          # line so '10/20/30/40/50 FAILED' (which contain the substring '0 FAILED')
          # can never pass.
          grep -qE ', 0 FAILED$' /tmp/checks.txt

      - name: Rebuild the four outputs
        working-directory: build
        env:
          # WeasyPrint reads the bundled @fontsource woff2 from the repo
          WON_FONTS_DIR: ${{ github.workspace }}/build/fonts/@fontsource
          WON_OUTPUT_DIR: ${{ github.workspace }}/outputs
        run: |
          python3 build_pdf.py
          # build_cover.py prepends the cover to the freshly built essay PDF, producing
          # the with-cover PDF the landing page's primary "Download PDF" CTA serves.
          # Without this the published set is mixed-vintage (new edition.html, stale book).
          python3 build_cover.py
          python3 build_html.py
          python3 build_audio.py

      - name: Push the rebuilt editions to a review branch (the owner opens the PR)
        env:
          BRANCH: living-update/auto-rebuild
        run: |
          git add outputs
          if git diff --cached --quiet; then
            echo "Rebuilt outputs are identical to main; nothing to review."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "living-update: rebuild editions from refreshed data"
          # The review branch belongs to this workflow; replace any earlier unreviewed rebuild.
          git push --force origin "$BRANCH"
          url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          echo "::notice title=Living update ready::Open the pull request: $url"
          {
            echo "### Living update ready for review"
            echo ""
            echo "Open the pull request: $url"
            echo ""
            echo "Before merging, a human must confirm:"
            echo "- the consistency suite passed (RESULT line ends \`, 0 FAILED\`) - see this job's log;"
            echo "- the with-cover PDF was re-merged from the fresh essay PDF (the \`Download PDF\` CTA);"
            echo "- this is a **decimals-only** refresh (every direction in the prose still holds)."
            echo "  If a direction changed, this is a new analytical edition: close the PR and handle it"
            echo "  in a chair session with the review body (skills/weight-of-nations-panel)."
          } >> "$GITHUB_STEP_SUMMARY"
